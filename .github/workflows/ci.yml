name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: validate the marketplace
        run: claude plugin validate --strict .
      - name: validate the plugin
        run: claude plugin validate --strict plugins/callmeter
      - name: leak check
        env:
          LEAK_TERMS_CONTENT: ${{ secrets.LEAK_TERMS }}
        run: |
          printf '%s\n' "$LEAK_TERMS_CONTENT" > "$RUNNER_TEMP/leak-terms.txt"
          LEAK_TERMS="$RUNNER_TEMP/leak-terms.txt" scripts/leak-check.sh
